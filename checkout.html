<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finalizar compra | SmartISP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root { --navy: #102c3d; --blue: #087ea4; --mint: #eaf7f5; --pale: #f3f7f8; --ink: #163342; --muted: #6b7f88; --line: #d8e5e7; --danger: #a53b3b; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--pale); color: var(--ink); font-family: 'DM Sans', sans-serif; }
    header { padding: 22px 6vw; background: white; border-bottom: 1px solid var(--line); }
    .logo { color: var(--navy); font: 700 25px 'Space Grotesk', sans-serif; letter-spacing: -.06em; }
    .logo b { color: var(--blue); }
    main { width: min(1080px, 92vw); margin: 42px auto 70px; }
    .eyebrow { color: var(--blue); font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 7px 0 30px; color: var(--navy); font: 700 clamp(30px, 5vw, 48px) 'Space Grotesk', sans-serif; }
    .layout { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(300px, .8fr); gap: 24px; align-items: start; }
    section { padding: 26px; background: white; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 28px rgba(16,44,61,.06); }
    h2 { margin: 0 0 22px; color: var(--navy); font: 700 21px 'Space Grotesk', sans-serif; }
    .field { display: block; margin: 15px 0; color: var(--ink); font-size: 13px; font-weight: 700; }
    input { display: block; width: 100%; margin-top: 7px; padding: 12px 13px; border: 1px solid var(--line); border-radius: 7px; color: var(--ink); background: #fbfefe; outline: 0; }
    input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(8,126,164,.12); }
    .two-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .cart-line { display: flex; justify-content: space-between; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
    .cart-line small { display: block; margin-top: 4px; color: var(--muted); }
    .summary-row { display: flex; justify-content: space-between; gap: 20px; margin-top: 16px; color: var(--muted); font-size: 14px; }
    .summary-row.total { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--navy); font-size: 19px; font-weight: 700; }
    button { width: 100%; margin-top: 24px; padding: 14px 18px; border: 0; border-radius: 7px; color: white; background: var(--blue); font-weight: 700; cursor: pointer; }
    button:hover { background: #06677f; }
    button:disabled { cursor: wait; opacity: .65; }
    .message { display: none; margin-top: 16px; padding: 12px; border-radius: 7px; color: #0d644f; background: var(--mint); font-size: 13px; line-height: 1.5; }
    .message.error { color: var(--danger); background: #fff0f0; }
    .message.show { display: block; }
    .empty { padding: 30px 0; color: var(--muted); text-align: center; }
    .payment-note { margin: 0 0 18px; padding: 12px; border-left: 3px solid var(--blue); color: var(--muted); background: var(--pale); font-size: 13px; line-height: 1.5; }
    @media (max-width: 760px) { main { margin-top: 28px; } .layout { grid-template-columns: 1fr; } .summary { order: -1; } }
    @media (max-width: 430px) { section { padding: 20px; } .two-columns { grid-template-columns: 1fr; gap: 0; } }
  </style>
</head>
<body>
  <header><a class="logo" href="/">smart<b>isp</b><span style="color:#f5a524">.</span></a></header>
  <main>
    <div class="eyebrow">Compra segura</div>
    <h1>Confirma tu compra</h1>
    <div class="layout">
      <section>
        <h2>Datos de entrega</h2>
        <form id="checkoutForm">
          <label class="field">Nombre completo<input name="name" required autocomplete="name"></label>
          <div class="two-columns">
            <label class="field">Correo electrónico<input name="email" type="email" required autocomplete="email"></label>
            <label class="field">Teléfono<input name="phone" type="tel" required minlength="7" autocomplete="tel"></label>
          </div>
          <label class="field">Dirección<input name="address" required autocomplete="street-address"></label>
          <label class="field">Ciudad<input name="city" required autocomplete="address-level2"></label>
          <p class="payment-note">Después de confirmar tus datos, continuaremos al pago seguro. Tus datos de tarjeta no se guardan en SmartISP.</p>
          <button id="submitButton" type="submit">Confirmar datos y continuar al pago</button>
          <div class="message" id="message" role="status"></div>
        </form>
      </section>
      <section class="summary">
        <h2>Resumen del carrito</h2>
        <div id="items"></div>
        <div class="summary-row total"><span>Total</span><strong id="total">$0</strong></div>
      </section>
    </div>
  </main>
  <script>
    const cart = JSON.parse(localStorage.getItem('smartisp.cart') || '[]');
    const money = value => '$' + Number(value || 0).toLocaleString('es-CL');
    const productKey = product => String(product.id || product.name);
    const grouped = [...new Map(cart.map(item => [productKey(item), item])).values()].map(item => ({ ...item, quantity: cart.filter(entry => productKey(entry) === productKey(item)).length }));
    const items = document.querySelector('#items');
    const total = grouped.reduce((sum, item) => sum + Number(item.price || 0) * item.quantity, 0);
    const hasPendingPrice = grouped.some(item => Number(item.price || 0) <= 0);
    items.innerHTML = grouped.length ? grouped.map(item => `<div class="cart-line"><div><strong>${item.name}</strong><small>Cantidad: ${item.quantity}</small></div><strong>${money(Number(item.price || 0) * item.quantity)}</strong></div>`).join('') : '<div class="empty">Tu carrito está vacío.</div>';
    document.querySelector('#total').textContent = money(total);
    const form = document.querySelector('#checkoutForm');
    const button = document.querySelector('#submitButton');
    const message = document.querySelector('#message');
    const showMessage = (text, error = false) => { message.textContent = text; message.classList.toggle('error', error); message.classList.add('show'); };
    const readResponse = async response => { const body = await response.json().catch(() => ({})); if (!response.ok) throw new Error(body.error || 'No se pudo crear el pedido.'); return body; };
    form.addEventListener('submit', async event => {
      event.preventDefault();
      if (!grouped.length) return showMessage('Tu carrito está vacío.', true);
      if (hasPendingPrice) return showMessage('Este carrito contiene productos pendientes de cotización. Solicita el precio antes de confirmar el pedido.', true);
      button.disabled = true;
      button.textContent = 'Creando pedido...';
      try {
        const values = Object.fromEntries(new FormData(form));
        const response = await fetch('/api/auth/customer-orders', { method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ items: grouped.map(item => ({ id: productKey(item), quantity: item.quantity })), shipping: values }) });
        const result = await readResponse(response);
        localStorage.removeItem('smartisp.cart');
        if (result.paymentUrl) { window.location.href = result.paymentUrl; return; }
        showMessage(`Pedido ${String(result.id).slice(0, 8)} creado. La pasarela de pago aún no está configurada; tu pedido quedó pendiente de pago.`);
        button.textContent = 'Pedido creado';
      } catch (error) {
        showMessage(error.message || 'No se pudo procesar la compra.', true);
        button.disabled = false;
        button.textContent = 'Confirmar datos y continuar al pago';
      }
    });
    fetch('/api/auth/me', { credentials: 'include' }).then(async response => { if (!response.ok) throw new Error(); return response.json(); }).then(result => { const user = result.user; const name = [user.name, user.surname].filter(Boolean).join(' '); form.elements.name.value = name; form.elements.email.value = user.email || ''; form.elements.phone.value = user.phone || ''; }).catch(() => showMessage('Inicia sesión en la tienda antes de confirmar tu compra.', true));
  </script>
</body>
</html>
