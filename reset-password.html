<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartISP | Restablecer contraseña</title>
  <style>
    :root { --ink: #163342; --muted: #6b7f88; --line: #d8e5e7; --blue: #087ea4; --dark: #102c3d; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; color: var(--ink); background: radial-gradient(circle at 90% 0, #d6f1ee 0, transparent 35%), #eef5f6; font: 15px Arial, sans-serif; }
    .card { width: min(440px, 100%); padding: 32px; border: 1px solid var(--line); border-radius: 16px; background: rgba(255,255,255,.95); box-shadow: 0 18px 45px rgba(16,44,61,.12); }
    .brand { margin-bottom: 26px; color: var(--dark); font-size: 14px; font-weight: 800; letter-spacing: .4px; }
    h1 { margin: 0 0 8px; font-size: 26px; } p { color: var(--muted); line-height: 1.5; }
    label { display: block; margin: 17px 0; color: var(--muted); font-size: 13px; font-weight: 700; }
    input { width: 100%; margin-top: 7px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); background: #fbfefe; }
    input:focus { outline: 0; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(8,126,164,.12); }
    button, a { display: inline-block; padding: 12px 16px; border: 0; border-radius: 8px; font-weight: 700; text-decoration: none; cursor: pointer; }
    button { color: white; background: var(--blue); } button:disabled { opacity: .65; cursor: wait; }
    .message { display: none; margin-top: 16px; padding: 12px; border-radius: 8px; color: #11815d; background: #e5faf1; font-size: 13px; }
    .message.show { display: block; } .message.error { color: #a53b3b; background: #fff0f0; }
    .back { margin-top: 18px; padding: 0; color: var(--blue); background: transparent; font-size: 13px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">smartisp.</div>
    <section id="requestView">
      <h1>Recuperar contraseña</h1>
      <p>Escribe el correo de tu cuenta y te enviaremos un enlace seguro para cambiarla.</p>
      <form id="requestForm"><label>Correo electrónico<input name="email" type="email" required autocomplete="email"></label><button type="submit">Enviar enlace</button><div class="message" data-message></div></form>
    </section>
    <section id="resetView" hidden>
      <h1>Crear nueva contraseña</h1>
      <p>Elige una contraseña nueva para volver a entrar a tu cuenta.</p>
      <form id="resetForm"><label>Nueva contraseña<input name="password" type="password" minlength="8" required autocomplete="new-password"></label><label>Repetir contraseña<input name="confirmation" type="password" minlength="8" required autocomplete="new-password"></label><button type="submit">Guardar contraseña</button><div class="message" data-message></div></form>
    </section>
    <a class="back" href="/">Volver a SmartISP</a>
  </main>
  <script>
    const api = async (action, options) => { const response = await fetch(`/api/auth/${action}`, { headers: { 'Content-Type': 'application/json' }, ...options }); const text = await response.text(); let result = {}; try { result = text ? JSON.parse(text) : {}; } catch { result = { error: text }; } if (!response.ok) throw new Error(result.error || 'No se pudo completar la operación.'); return result; };
    const show = (form, text, error = false) => { const message = form.querySelector('[data-message]'); message.textContent = text; message.classList.toggle('error', error); message.classList.add('show'); };
    const token = new URLSearchParams(location.search).get('token');
    const requestView = document.querySelector('#requestView'); const resetView = document.querySelector('#resetView');
    if (token) { requestView.hidden = true; resetView.hidden = false; }
    document.querySelector('#requestForm').addEventListener('submit', async event => { event.preventDefault(); const form = event.currentTarget; const button = form.querySelector('button'); button.disabled = true; try { await api('request-password-reset', { method: 'POST', body: JSON.stringify(Object.fromEntries(new FormData(form))) }); show(form, 'Si el correo está registrado, recibirás un enlace para recuperar tu contraseña.'); form.reset(); } catch (error) { show(form, error.message, true); } finally { button.disabled = false; } });
    document.querySelector('#resetForm').addEventListener('submit', async event => { event.preventDefault(); const form = event.currentTarget; const values = Object.fromEntries(new FormData(form)); if (values.password !== values.confirmation) return show(form, 'Las contraseñas no coinciden.', true); const button = form.querySelector('button'); button.disabled = true; try { await api('reset-password', { method: 'POST', body: JSON.stringify({ ...values, token }) }); show(form, 'Contraseña actualizada. Ya puedes iniciar sesión.'); form.reset(); } catch (error) { show(form, error.message, true); } finally { button.disabled = false; } });
  </script>
</body>
</html>
