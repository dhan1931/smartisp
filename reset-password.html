<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartISP | Restablecer contraseña</title>
  <style>
    :root { --ink: #163342; --muted: #6b7f88; --line: #d8e5e7; --blue: #087ea4; --blue-dark: #06677f; --dark: #102c3d; --green: #11815d; --red: #a53b3b; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; color: var(--ink); background: radial-gradient(circle at 90% 0, #d6f1ee 0, transparent 35%), #eef5f6; font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    .card { width: min(460px, 100%); padding: 36px; border: 1px solid var(--line); border-radius: 16px; background: rgba(255,255,255,.98); box-shadow: 0 18px 45px rgba(16,44,61,.12); }
    .brand { margin-bottom: 24px; color: var(--dark); font-size: 16px; font-weight: 800; letter-spacing: -.3px; }
    .brand span { color: var(--blue); }
    h1 { margin: 0 0 10px; font-size: 24px; color: var(--dark); }
    p { color: var(--muted); line-height: 1.5; margin: 0 0 18px; font-size: 14px; }
    label { display: block; margin: 16px 0; color: var(--muted); font-size: 13px; font-weight: 700; }
    input { width: 100%; margin-top: 7px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); background: #fbfefe; font-size: 14px; transition: border-color .2s, box-shadow .2s; }
    input:focus { outline: 0; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(8,126,164,.15); }
    .btn-submit { display: block; width: 100%; padding: 13px 18px; border: 0; border-radius: 8px; font-weight: 700; font-size: 14.5px; color: white; background: var(--blue); cursor: pointer; text-align: center; text-decoration: none; transition: background .2s, opacity .2s; }
    .btn-submit:hover { background: var(--blue-dark); }
    .btn-submit:disabled { opacity: .65; cursor: wait; }
    .message { display: none; margin-top: 18px; padding: 14px 16px; border-radius: 8px; color: var(--green); background: #e5faf1; font-size: 13.5px; line-height: 1.5; border: 1px solid #b7eed9; }
    .message.show { display: block; }
    .message.error { color: var(--red); background: #fff0f0; border-color: #ffd1d1; }
    .nav-links { margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--line); display: flex; gap: 16px; flex-wrap: wrap; }
    .nav-links a { color: var(--blue); text-decoration: none; font-size: 13px; font-weight: 600; }
    .nav-links a:hover { text-decoration: underline; }
    .success-box { display: none; margin-top: 18px; text-align: center; }
    .success-box.show { display: block; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">smart<span>isp</span>.</div>
    
    <!-- VISTA 1: SOLICITUD DE RESTABLECIMIENTO -->
    <section id="requestView">
      <h1>Recuperar contraseña</h1>
      <p>Escribe el correo de tu cuenta y te enviaremos un enlace seguro para cambiarla.</p>
      <form id="requestForm">
        <label>
          Correo electrónico
          <input name="email" type="email" required autocomplete="email" placeholder="ejemplo@correo.com">
        </label>
        <button type="submit" class="btn-submit" id="btnRequest">Enviar enlace</button>
        <div class="message" data-message></div>
      </form>
    </section>

    <!-- VISTA 2: FORMULARIO PARA DEFINIR NUEVA CONTRASEÑA -->
    <section id="resetView" hidden>
      <h1>Crear nueva contraseña</h1>
      <p>Elige una contraseña nueva para volver a ingresar a tu cuenta de SmartISP.</p>
      <form id="resetForm">
        <label>
          Nueva contraseña
          <input name="password" type="password" minlength="6" required autocomplete="new-password" placeholder="Mínimo 6 caracteres">
        </label>
        <label>
          Repetir contraseña
          <input name="confirmation" type="password" minlength="6" required autocomplete="new-password" placeholder="Repite tu nueva contraseña">
        </label>
        <button type="submit" class="btn-submit" id="btnReset">Guardar contraseña</button>
        <div class="message" data-message></div>
        <div class="success-box" id="resetSuccessBox">
          <a href="tienda.html" class="btn-submit" style="margin-top: 12px;">Iniciar sesión en la Tienda &rarr;</a>
        </div>
      </form>
    </section>

    <div class="nav-links">
      <a href="tienda.html">🛒 Ir a la Tienda</a>
      <a href="/">🏠 Volver a SmartISP</a>
    </div>
  </main>

  <script>
    const api = async (action, options) => {
      const response = await fetch(`/api/auth/${action}`, {
        headers: { 'Content-Type': 'application/json' },
        ...options
      });
      const text = await response.text();
      let result = {};
      try {
        result = text ? JSON.parse(text) : {};
      } catch {
        result = { error: text };
      }
      if (!response.ok) {
        throw new Error(result.error || 'No se pudo completar la operación.');
      }
      return result;
    };

    const show = (container, text, error = false, isHtml = false) => {
      const message = container.querySelector('[data-message]');
      if (!message) return;
      if (isHtml) {
        message.innerHTML = text;
      } else {
        message.textContent = text;
      }
      message.classList.toggle('error', error);
      message.classList.add('show');
    };

    const token = new URLSearchParams(location.search).get('token');
    const requestView = document.querySelector('#requestView');
    const resetView = document.querySelector('#resetView');

    if (token) {
      requestView.hidden = true;
      resetView.hidden = false;
    }

    // Manejo del formulario de solicitud
    document.querySelector('#requestForm').addEventListener('submit', async event => {
      event.preventDefault();
      const form = event.currentTarget;
      const button = form.querySelector('#btnRequest');
      const originalText = button.textContent;
      button.disabled = true;
      button.textContent = 'Enviando enlace...';

      try {
        const data = Object.fromEntries(new FormData(form));
        const res = await api('request-password-reset', {
          method: 'POST',
          body: JSON.stringify(data)
        });
        show(form, res.message || 'Si el correo está registrado, recibirás un enlace en tu bandeja de entrada (revisa también Spam).');
        form.querySelector('input[name="email"]').value = '';
      } catch (error) {
        show(form, error.message, true);
      } finally {
        button.disabled = false;
        button.textContent = originalText;
      }
    });

    // Manejo del formulario de nueva contraseña
    document.querySelector('#resetForm').addEventListener('submit', async event => {
      event.preventDefault();
      const form = event.currentTarget;
      const values = Object.fromEntries(new FormData(form));

      if (values.password !== values.confirmation) {
        return show(form, 'Las contraseñas no coinciden. Por favor verifícalas.', true);
      }

      const button = form.querySelector('#btnReset');
      const originalText = button.textContent;
      button.disabled = true;
      button.textContent = 'Guardando contraseña...';

      try {
        const res = await api('reset-password', {
          method: 'POST',
          body: JSON.stringify({ ...values, token })
        });
        show(form, res.message || '¡Contraseña actualizada exitosamente! Ya puedes iniciar sesión.');
        form.querySelectorAll('input').forEach(i => i.disabled = true);
        button.style.display = 'none';
        document.querySelector('#resetSuccessBox')?.classList.add('show');
      } catch (error) {
        const msg = error.message.includes('expirado') || error.message.includes('válido')
          ? `${error.message} <br><a href="reset-password.html" style="color:var(--blue);font-weight:700;display:inline-block;margin-top:6px;">Solicitar un nuevo enlace</a>`
          : error.message;
        show(form, msg, true, true);
      } finally {
        button.disabled = false;
        button.textContent = originalText;
      }
    });
  </script>
</body>
</html>
