<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartISP | Administracion</title>
  <style>
    :root { --ink: #163342; --muted: #6b7f88; --line: #d8e5e7; --pale: #f3f7f8; --blue: #087ea4; --danger: #a53b3b; }
    * { box-sizing: border-box; } body { margin: 0; color: var(--ink); background: var(--pale); font: 15px Arial, sans-serif; }
    button, input, textarea, select { font: inherit; } button { cursor: pointer; }
    .top { padding: 22px 5vw; color: white; background: #102c3d; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .top h1 { margin: 0; font-size: 24px; } .top span { color: #b7d4dc; font-size: 13px; }
    .shell { width: min(1180px, 90vw); margin: 32px auto; } .login, .panel { background: white; border: 1px solid var(--line); border-radius: 10px; padding: 28px; box-shadow: 0 12px 30px rgba(16,44,61,.06); }
    .login { width: min(430px, 100%); margin: 80px auto; } h2 { margin-top: 0; } h3 { margin: 0 0 17px; } label { display: block; margin: 14px 0; color: var(--muted); font-size: 13px; font-weight: 700; }
    input, textarea, select { width: 100%; margin-top: 7px; padding: 11px 12px; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; background: #fbfefe; } textarea { min-height: 90px; resize: vertical; }
    .button { padding: 11px 16px; color: white; border: 0; border-radius: 6px; background: var(--blue); font-weight: 700; } .button.secondary { color: var(--ink); background: #e7f2f3; } .button.danger { background: var(--danger); }
    .message { display: none; margin: 14px 0; padding: 11px; border-radius: 6px; background: #e5faf1; color: #11815d; font-size: 13px; } .message.show { display: block; } .message.error { color: var(--danger); background: #fff0f0; }
    .hidden { display: none !important; } .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; } .wide { grid-column: 1 / -1; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-bottom: 24px; } .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .product-row { display: grid; grid-template-columns: 1fr 120px 110px auto; gap: 10px; align-items: end; padding: 15px 0; border-top: 1px solid var(--line); } .product-row:first-child { border-top: 0; }
    .product-row label { margin: 0; } .product-row .description { grid-column: 1 / 3; } .product-row .image { grid-column: 3 / 4; } .product-row .row-actions { display: flex; gap: 5px; }
    @media (max-width: 720px) { .grid, .product-row { grid-template-columns: 1fr; } .wide, .product-row .description, .product-row .image { grid-column: auto; } .top, .toolbar { align-items: flex-start; flex-direction: column; } }
  </style>
</head>
<body>
  <header class="top"><div><h1>SmartISP Administracion</h1><span>Gestiona tu tienda sin editar el codigo</span></div><a class="button secondary" href="/">Ver tienda</a></header>
  <main class="shell">
    <section id="loginPanel" class="login"><h2>Acceso de administrador</h2><p>Usa la cuenta autorizada por el propietario del proyecto.</p><form id="loginForm"><label>Correo<input name="email" type="email" required autocomplete="email"></label><label>Contrasena<input name="password" type="password" required autocomplete="current-password"></label><button class="button" type="submit">Entrar</button><div id="loginMessage" class="message"></div></form></section>
    <section id="adminPanel" class="hidden">
      <div class="toolbar"><div><h2>Panel de control</h2><span id="adminIdentity"></span></div><button id="logoutButton" class="button danger">Cerrar sesion</button></div>
      <div class="grid">
        <section class="panel"><h3>Apariencia y contenido</h3><form id="contentForm"><label>Nombre de marca<input name="brand_name" placeholder="SmartISP"></label><label>Texto del logo<input name="logo_text" placeholder="smartisp"></label><label>Titulo principal<input name="hero_title" placeholder="Infraestructura que conecta"></label><label>Descripcion principal<textarea name="hero_text"></textarea></label><label>Imagen del banner<input name="hero_image" type="url" placeholder="https://..."></label><label>Color principal<input name="primary_color" type="color" value="#087ea4"></label><label>Texto del pie de pagina<textarea name="footer_text"></textarea></label><button class="button" type="submit">Guardar apariencia</button><div id="contentMessage" class="message"></div></form></section>
        <section class="panel"><h3>Visibilidad de secciones</h3><form id="visibilityForm"><label>Catalogo visible<select name="catalog_visible"><option value="true">Si</option><option value="false">No</option></select></label><label>Banner visible<select name="hero_visible"><option value="true">Si</option><option value="false">No</option></select></label><label>Beneficios visibles<select name="benefits_visible"><option value="true">Si</option><option value="false">No</option></select></label><button class="button" type="submit">Guardar visibilidad</button><div id="visibilityMessage" class="message"></div></form></section>
        <section class="panel wide"><div class="toolbar"><h3>Catalogo de productos</h3><button id="newProductButton" class="button secondary" type="button">Nuevo producto</button></div><div id="productsList"></div><div id="productMessage" class="message"></div></section>
      </div>
    </section>
  </main>
  <script>
    const $ = selector => document.querySelector(selector);
    const showMessage = (element, text, error = false) => { element.textContent = text; element.classList.toggle('error', error); element.classList.add('show'); };
    const api = async (action, options = {}) => { const response = await fetch(`/api/auth/${action}`, { headers: { 'Content-Type': 'application/json' }, ...options }); const text = await response.text(); let result = {}; try { result = text ? JSON.parse(text) : {}; } catch { result = { error: text || `Respuesta invalida (${response.status})` }; } if (!response.ok) throw new Error(result.error || 'No se pudo completar la operacion.'); return result; };
    const loadContent = async () => { const result = await api('admin-content'); const values = Object.fromEntries(result.content.map(item => [item.key, item.value])); document.querySelectorAll('#contentForm [name]').forEach(input => { if (values[input.name] !== undefined) input.value = values[input.name]; }); document.querySelectorAll('#visibilityForm [name]').forEach(input => { if (values[input.name] !== undefined) input.value = values[input.name]; }); };
    const productFields = product => `<form class="product-row" data-product-id="${product.id || ''}"><label>Nombre<input name="name" value="${escapeHtml(product.name || '')}" required></label><label>Precio<input name="price" type="number" min="0" step="0.01" value="${product.price || 0}" required></label><label>Categoria<input name="category" value="${escapeHtml(product.category || '')}"></label><label>Visible<select name="visible"><option value="true" ${product.visible !== false ? 'selected' : ''}>Si</option><option value="false" ${product.visible === false ? 'selected' : ''}>No</option></select></label><label class="description">Descripcion<textarea name="description">${escapeHtml(product.description || '')}</textarea></label><label class="image">URL de imagen<input name="imageUrl" type="url" value="${escapeHtml(product.imageUrl || '')}"></label><div class="row-actions"><button class="button" type="submit">Guardar</button><button class="button danger" data-delete type="button">Eliminar</button></div></form>`;
    const escapeHtml = value => String(value).replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[character]));
    const loadProducts = async () => { const result = await api('admin-products'); $('#productsList').innerHTML = result.products.map(productFields).join('') || '<p>No hay productos guardados aun.</p>'; document.querySelectorAll('.product-row').forEach(form => { form.addEventListener('submit', async event => { event.preventDefault(); const values = Object.fromEntries(new FormData(form)); values.id = form.dataset.productId; values.price = Number(values.price); values.visible = values.visible === 'true'; try { await api('admin-products', { method: 'POST', body: JSON.stringify(values) }); showMessage($('#productMessage'), 'Producto guardado correctamente.'); await loadProducts(); } catch (error) { showMessage($('#productMessage'), error.message, true); } }); form.querySelector('[data-delete]').addEventListener('click', async () => { if (!form.dataset.productId) return form.remove(); try { await api(`admin-products?id=${encodeURIComponent(form.dataset.productId)}`, { method: 'DELETE' }); showMessage($('#productMessage'), 'Producto eliminado.'); await loadProducts(); } catch (error) { showMessage($('#productMessage'), error.message, true); } }); }); };
    const openPanel = async user => { $('#loginPanel').classList.add('hidden'); $('#adminPanel').classList.remove('hidden'); $('#adminIdentity').textContent = `${user.name} ${user.surname || ''} - ${user.email}`; await loadContent(); await loadProducts(); };
    $('#loginForm').addEventListener('submit', async event => { event.preventDefault(); try { const result = await api('login', { method: 'POST', body: JSON.stringify(Object.fromEntries(new FormData(event.currentTarget))) }); if (result.user.role !== 'admin') throw new Error('Esta cuenta no tiene permisos de administrador.'); await openPanel(result.user); } catch (error) { showMessage($('#loginMessage'), error.message, true); } });
    $('#contentForm').addEventListener('submit', async event => { event.preventDefault(); try { const values = Object.fromEntries(new FormData(event.currentTarget)); await api('admin-content', { method: 'POST', body: JSON.stringify(values) }); showMessage($('#contentMessage'), 'Apariencia guardada correctamente.'); } catch (error) { showMessage($('#contentMessage'), error.message, true); } });
    $('#visibilityForm').addEventListener('submit', async event => { event.preventDefault(); try { await api('admin-content', { method: 'POST', body: JSON.stringify(Object.fromEntries(new FormData(event.currentTarget))) }); showMessage($('#visibilityMessage'), 'Visibilidad guardada correctamente.'); } catch (error) { showMessage($('#visibilityMessage'), error.message, true); } });
    $('#newProductButton').addEventListener('click', () => { $('#productsList').insertAdjacentHTML('afterbegin', productFields({})); const form = $('#productsList .product-row'); form.scrollIntoView({ behavior: 'smooth' }); form.addEventListener('submit', async event => { event.preventDefault(); const values = Object.fromEntries(new FormData(form)); values.price = Number(values.price); values.visible = values.visible === 'true'; try { await api('admin-products', { method: 'POST', body: JSON.stringify(values) }); showMessage($('#productMessage'), 'Producto creado correctamente.'); await loadProducts(); } catch (error) { showMessage($('#productMessage'), error.message, true); } }); form.querySelector('[data-delete]').addEventListener('click', () => form.remove()); });
    $('#logoutButton').addEventListener('click', async () => { await api('logout', { method: 'POST' }); location.reload(); });
    api('me').then(result => { if (result.user.role === 'admin') openPanel(result.user); }).catch(() => {});
  </script>
</body>
</html>
