<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartISP | Pedidos</title>
  <link rel="icon" href="/assets/favicons/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/assets/favicons/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/favicons/favicon-192x192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicons/apple-touch-icon.png">
  <link rel="manifest" href="/assets/site.webmanifest">
  <meta name="theme-color" content="#102c3d">
  <link rel="stylesheet" href="/assets/css/admin/pedidos-page.css?v=20261025">
  <script src="/assets/vendor/lucide-icons.min.js?v=8707c619"></script>
  <script src="/assets/js/admin/admin-page.js?v=20261025" defer></script>
  <script src="/assets/js/admin/pedidos-page.js?v=20261025" defer></script>
</head>
<body>
  <link rel="stylesheet" href="/assets/css/admin/admin-nav.css?v=admin-brand-20261011">
  <div id="smartisp-admin-nav" class="is-loading" data-active="pedidos"></div>
  <script src="/assets/js/admin/admin-nav.js?v=admin-inventario-20261023" defer></script>
  <header class="top"><div><h1>SmartISP Administracion</h1><span>Centro de pedidos</span></div></header>
  <main class="shell" id="app" hidden>
    <section id="ordersPanel">
      <div class="toolbar">
        <div><h2 style="margin:0;">Pedidos</h2><span id="adminIdentity" style="color:var(--muted);font-size:12.5px;"></span></div>
      </div>

      <div class="stats-row" id="statsRow"></div>

      <div class="filter-bar">
        <div class="status-tabs" id="statusTabs"></div>
        <input type="text" id="searchInput" placeholder="Buscar por id, cliente o correo...">
      </div>

      <div id="ordersTableWrap">
        <table class="orders-table">
          <thead><tr><th>Pedido</th><th>Fecha</th><th>Cliente</th><th>Items</th><th>Total</th><th>Estado</th><th></th></tr></thead>
          <tbody id="ordersBody"></tbody>
        </table>
      </div>
      <div id="emptyState" class="empty-state hidden">No hay pedidos que coincidan con el filtro actual.</div>

      <div class="pager">
        <button id="prevPageBtn" class="button secondary" type="button"><i data-lucide="arrow-left" style="width:14px;height:14px;"></i> Anterior</button>
        <span id="pageInfo"></span>
        <button id="nextPageBtn" class="button secondary" type="button">Siguiente <i data-lucide="arrow-right" style="width:14px;height:14px;"></i></button>
      </div>
    </section>
  </main>

  <div id="orderModal" class="modal-overlay" hidden>
    <div class="modal-box" style="position:relative;" role="dialog" aria-modal="true" aria-labelledby="modalOrderTitle">
      <button class="modal-close" id="closeOrderModalBtn" type="button" aria-label="Cerrar"><i data-lucide="x" style="width:18px;height:18px;"></i></button>
      <h3 id="modalOrderTitle" style="margin:0 0 4px;">Pedido</h3>
      <p id="modalOrderDate" style="margin:0 0 18px;color:var(--muted);font-size:12.5px;"></p>

        <div class="order-parties">
        <div>
          <strong style="font-size:12px;color:var(--muted);text-transform:uppercase;">Cliente</strong>
          <div id="modalCustomer" style="font-size:13.5px;margin-top:4px;"></div>
        </div>
        <div>
          <strong style="font-size:12px;color:var(--muted);text-transform:uppercase;">Envío</strong>
          <div id="modalShipping" style="font-size:13.5px;margin-top:4px;"></div>
        </div>
      </div>

      <strong style="font-size:12px;color:var(--muted);text-transform:uppercase;">Productos</strong>
      <div id="modalItems" style="margin:8px 0 18px;"></div>

      <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#f8fafc;border-radius:8px;margin-bottom:18px;">
        <strong>Total</strong>
        <strong id="modalTotal" style="color:var(--blue);font-size:16px;"></strong>
      </div>
      <div id="modalPayment" style="margin:-10px 0 18px;color:var(--muted);font-size:12.5px;"></div>

      <form id="statusForm">
        <label>Cambiar estado
          <select id="statusSelect" name="status"></select>
        </label>
        <div id="statusHint" style="margin:-4px 0 12px;color:var(--muted);font-size:12.5px;line-height:1.45;"></div>
        <label>Nota interna / mensaje al cliente (opcional)
          <textarea id="statusNote" name="note" rows="2" placeholder="Se incluye en el correo que recibe el cliente si lo completas."></textarea>
        </label>
        <button class="button" type="submit" id="statusSubmitBtn">Actualizar estado</button>
        <div id="statusMessage" class="message"></div>
      </form>

      <strong style="font-size:12px;color:var(--muted);text-transform:uppercase;display:block;margin-top:20px;">Historial</strong>
      <div id="modalTimeline" class="timeline"></div>
    </div>
  </div>

</body>
</html>
