<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmartISP | Clientes</title>
  <link rel="icon" href="/assets/favicons/favicon.ico">
  <link rel="stylesheet" href="/assets/css/admin/admin-nav.css?v=admin-brand-20261011">
  <script src="/assets/vendor/lucide-icons.min.js?v=8707c619" defer></script>
  <script src="/assets/js/admin/admin-nav.js?v=admin-inventario-20261023" defer></script>
  <link rel="stylesheet" href="/assets/css/admin/clientes-page.css?v=20261025">
  <script src="/assets/js/admin/admin-page.js?v=20261025" defer></script>
  <script src="/assets/js/admin/clientes-page.js?v=20261025" defer></script>
</head>
<body>
  <div id="smartisp-admin-nav" class="is-loading" data-active="clientes"></div>
  <main class="shell" id="app" hidden>
    <header class="page-head"><div><h1>Clientes</h1><p>Cuentas registradas y compradores de la tienda, reunidos en un solo lugar.</p></div><div class="head-actions"><button class="button" id="refresh" type="button"><i data-lucide="rotate-cw"></i> Actualizar</button></div></header>
    <section class="stats" id="stats" aria-label="Resumen de clientes"></section>
    <section class="workspace" aria-label="Directorio de clientes">
      <div class="toolbar"><label class="search"><i data-lucide="search"></i><input id="search" type="search" placeholder="Buscar nombre, correo o teléfono" autocomplete="off"></label><select id="type" aria-label="Tipo de cliente"><option value="all">Todos los clientes</option><option value="account">Cuentas registradas</option><option value="guest">Compradores invitados</option></select><span class="result-count" id="count"></span></div>
      <div class="table-wrap" id="tableWrap"><table><thead><tr><th>Cliente</th><th>Tipo</th><th>Contacto</th><th>Pedidos</th><th>Valor no cancelado</th><th>Última compra</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
      <div class="empty" id="empty" hidden><i data-lucide="users-round"></i>No hay clientes que coincidan con la búsqueda.</div>
      <div class="load-error" id="error" hidden></div>
      <footer class="pager"><button class="button" id="prev" type="button">Anterior</button><span id="pageInfo"></span><button class="button" id="next" type="button">Siguiente</button></footer>
    </section>
  </main>
  <div class="modal" id="detail" hidden><section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="detailTitle"><header class="modal-head"><div><h2 id="detailTitle">Cliente</h2><p id="detailSource"></p></div><button class="icon-button" id="closeDetail" type="button" aria-label="Cerrar"><i data-lucide="x"></i></button></header><div class="profile-grid" id="profile"></div><h3>Pedidos recientes</h3><div class="history" id="history"></div></section></div>
</body>
</html>
